<style>
:root{--bg:#f1ede4;--card:#fbf9f4;--tx:#1b1f2a;--mut:#7b7568;--bd:#e3dccf;--ac:#1b1f2a;--acx:#fbf9f4;
--g:#e1eaf6;--gx:#2c5a96;--d:#f6e6cd;--dx:#93560f;--bad:#b42318;
--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101319;--card:#181c25;--tx:#eceff4;--mut:#8f97a5;--bd:#262c38;--ac:#eceff4;--acx:#101319;--g:#1a2941;--gx:#8fb5f0;--d:#392c18;--dx:#eab874;--bad:#f2837a}}
:root[data-theme="dark"]{--bg:#101319;--card:#181c25;--tx:#eceff4;--mut:#8f97a5;--bd:#262c38;--ac:#eceff4;--acx:#101319;--g:#1a2941;--gx:#8fb5f0;--d:#392c18;--dx:#eab874;--bad:#f2837a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.35}
main{max-width:520px;margin:0 auto;padding:22px 16px 110px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 4px}
h1{font-size:30px;line-height:1.1;margin:0 0 18px;letter-spacing:-.02em}
h2{margin:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:16px}
label{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:14px 0 6px}
input,select,textarea{display:block;width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;padding:12px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
input[type=date],input[type=time]{min-height:50px;text-align:left}
input::-webkit-date-and-time-value{text-align:left;min-width:0}
.time::-webkit-date-and-time-value{text-align:center}
.time{text-align:center}
input:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;gap:10px}.row>div{flex:1;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.seg button{border:2px solid transparent;border-radius:18px;padding:14px 12px;font:inherit;font-size:17px;font-weight:700;text-align:left;opacity:.55;transition:.15s}
.seg button small{display:block;font-weight:400;font-size:12px;margin-top:2px}
.seg .g,.panel.g{background:var(--g);color:var(--gx)}
.seg .d,.panel.d{background:var(--d);color:var(--dx)}
.seg button.on{opacity:1;border-color:currentColor}
.time{font-family:var(--mono);font-size:46px;text-align:center;padding:10px;letter-spacing:.02em}
.go{width:100%;margin-top:18px;padding:15px;border:0;border-radius:14px;background:var(--ac);color:var(--acx);font:inherit;font-size:17px;font-weight:700}
.go:active{transform:scale(.98)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:18px}
.days button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:9px 0 7px;font:inherit;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.days i{font-style:normal;font-family:var(--mono);font-size:11px;font-weight:400;color:var(--mut)}
.days button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.days button.on i{color:var(--acx);opacity:.7}
.dayname{font-size:26px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:2px 0 16px;font-size:14px}
.panel{border-radius:22px;padding:14px 14px 6px;margin-bottom:14px}
.panel header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.panel header b{font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.panel header span{font-size:12px;opacity:.75}
.it{background:var(--card);color:var(--tx);border-radius:16px;padding:13px;margin-bottom:10px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.ln{font-family:var(--mono);font-weight:500;font-size:15px;border-radius:10px;padding:8px 10px;min-width:54px;text-align:center;background:var(--bg)}
.panel.g .ln{color:var(--gx)}.panel.d .ln{color:var(--dx)}
.stop{font-size:13px;color:var(--mut);margin-bottom:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk{position:relative;height:4px;border-radius:4px;background:var(--bd);margin:0 5px}
.trk b{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;transform:translate(-50%,-50%);background:var(--mut)}
.trk b.m{width:15px;height:15px;background:currentColor}
.panel.g .trk b.m{background:var(--gx)}.panel.d .trk b.m{background:var(--dx)}
.lab{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mut);margin-top:6px}
.tm{font-family:var(--mono);font-size:26px;font-weight:500;text-align:right;letter-spacing:-.02em}
.tm small{display:block;font-family:var(--sans);font-size:11px;color:var(--mut);letter-spacing:0}
.none{font-size:13px;opacity:.7;padding:4px 2px 14px}
.dh{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin:20px 4px 8px}
.rw{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--bd)}
.rw:last-child{border:0}
.pill{font-size:11px;font-weight:700;padding:4px 9px;border-radius:8px}
.pill.g{background:var(--g);color:var(--gx)}.pill.d{background:var(--d);color:var(--dx)}
.rw .t{font-family:var(--mono);font-size:17px}
.del{border:0;background:none;color:var(--bad);font:inherit;font-size:13px;padding:6px 2px}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:10px 14px;font:inherit;font-size:14px;margin:6px 8px 0 0}
.mut{color:var(--mut);font-size:13px}
.empty{text-align:center;color:var(--mut);padding:40px 0}
nav{position:fixed;left:0;right:0;bottom:0;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--bd);display:flex;gap:6px;justify-content:center}
nav button{flex:1;max-width:160px;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px;border-radius:14px}
nav button.on{color:var(--tx);background:var(--card)}
nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ac);color:var(--acx);padding:10px 18px;border-radius:30px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:.25s}
#toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<main>
<p class="eyebrow">Otobüs günlüğü</p>
<h1>Durak Defteri</h1>
<div id="v0"></div><div id="v1" hidden></div><div id="v2" hidden></div>
</main>
<div id="toast"></div>
<nav>
<button id="t0" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Kayıt</button>
<button id="t1"><svg viewBox="0 0 24 24"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Özet</button>
<button id="t2"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Geçmiş</button>
</nav>
<script>
const DAYS=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
const FULL=["Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
let recs=[];
try{recs=JSON.parse(localStorage.getItem("otobus")||"[]")}catch(e){recs=[]}
const save=()=>{try{localStorage.setItem("otobus",JSON.stringify(recs))}catch(e){}};
const $=id=>document.getElementById(id);
const m=t=>{const[h,n]=t.split(":").map(Number);return h*60+n};
const fmt=x=>{x=Math.round(x);return String(Math.floor(x/60)%24).padStart(2,"0")+":"+String(x%60).padStart(2,"0")};
const dow=d=>{const[y,mo,da]=d.split("-").map(Number);return(new Date(y,mo-1,da).getDay()+6)%7};
const p2=n=>String(n).padStart(2,"0");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())};
const nowT=()=>{const d=new Date();return p2(d.getHours())+":"+p2(d.getMinutes())};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cls=y=>y==="Gidiş"?"g":"d";
let selDay=(new Date().getDay()+6)%7,dir=new Date().getHours()<13?"Gidiş":"Geliş";
function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1600)}
function tab(i){[0,1,2].forEach(k=>{$("v"+k).hidden=k!==i;$("t"+k).classList.toggle("on",k===i)});if(i===1)renderSum();if(i===2)renderHist();scrollTo(0,0)}
[0,1,2].forEach(k=>$("t"+k).onclick=()=>tab(k));

function renderForm(){
const lines=[...new Set(recs.map(r=>r.line))],stops=[...new Set(recs.map(r=>r.stop).filter(Boolean))],last=recs[recs.length-1]||{};
$("v0").innerHTML=`<div class="seg">
<button class="g ${dir==="Gidiş"?"on":""}" data-y="Gidiş">Gidiş<small>işe giderken</small></button>
<button class="d ${dir==="Geliş"?"on":""}" data-y="Geliş">Geliş<small>eve dönerken</small></button></div>
<div class="card">
<label style="margin-top:0">Biniş saati</label><input type="time" class="time" id="f_a" value="${nowT()}">
<div class="row"><div><label>Hat</label><input id="f_l" list="ll" placeholder="örn. 34AS" style="text-transform:uppercase" value="${esc(last.line||"")}"></div>
<div><label>Durak</label><input id="f_s" list="sl" placeholder="isteğe bağlı" value="${esc(last.stop||"")}"></div></div>
<datalist id="ll">${lines.map(l=>`<option value="${esc(l)}">`).join("")}</datalist>
<datalist id="sl">${stops.map(l=>`<option value="${esc(l)}">`).join("")}</datalist>
<label>Tarih</label><input type="date" id="f_d" value="${today()}">
<button class="go" id="f_go">Kaydet</button></div>
<p class="mut" style="text-align:center;margin-top:14px">${recs.length} kayıt</p>`;
$("v0").querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{dir=b.dataset.y;$("v0").querySelectorAll(".seg button").forEach(x=>x.classList.toggle("on",x===b))});
$("f_go").onclick=()=>{
const d=$("f_d").value,l=$("f_l").value.trim().toUpperCase(),s=$("f_s").value.trim(),a=$("f_a").value;
if(!d||!l||!a){toast("Tarih, hat ve saat gerekli");return}
recs.push({id:Date.now(),d,line:l,stop:s,act:a,dir});save();renderForm();toast("Kaydedildi")};
}

const clusters=a=>{let ts=a.map(r=>m(r.act));if(Math.max(...ts)-Math.min(...ts)>720)ts=ts.map(t=>t<720?t+1440:t);ts.sort((x,y)=>x-y);const out=[];ts.forEach(t=>{const c=out[out.length-1];if(c&&t-c[c.length-1]<=15)c.push(t);else out.push([t])});return out};
const mean=c=>c.reduce((t,x)=>t+x,0)/c.length;

function renderSum(){
const cnt=DAYS.map((_,i)=>recs.filter(r=>dow(r.d)===i).length),rs=recs.filter(r=>dow(r.d)===selDay);
let h=`<div class="days">${DAYS.map((d,i)=>`<button data-d="${i}" class="${i===selDay?"on":""}">${d}<i>${cnt[i]}</i></button>`).join("")}</div>
<h2 class="dayname">${FULL[selDay]}</h2><p class="sub">${rs.length?rs.length+" kayıt, ortalama biniş saatleri":"Bu gün için kayıt yok"}</p>`;
["Gidiş","Geliş"].forEach(y=>{
const ry=rs.filter(r=>(r.dir||"Gidiş")===y),g={};
ry.forEach(r=>{const k=r.line+"|"+r.stop;(g[k]=g[k]||[]).push(r)});
const items=[];Object.keys(g).forEach(k=>{const[l,s]=k.split("|");clusters(g[k]).forEach(c=>items.push({l,s,c}))});
h+=`<section class="panel ${cls(y)}"><header><b>${y}</b><span>${ry.length} kayıt</span></header>`;
if(!items.length)h+=`<div class="none">Kayıt yok</div>`;
items.sort((p,q)=>mean(p.c)-mean(q.c)).forEach(({l,s,c})=>{
const mn=Math.min(...c),mx=Math.max(...c),mu=mean(c),sp=mx-mn,pos=sp?(mu-mn)/sp*100:50;
h+=`<article class="it"><div class="ln">${esc(l)}</div><div style="min-width:0"><div class="stop">${s?esc(s):"Durak belirtilmedi"}</div>
<div class="trk">${sp?`<b style="left:0"></b><b style="left:100%"></b>`:""}<b class="m" style="left:${pos}%"></b></div>
<div class="lab"><span>${sp?fmt(mn):""}</span><span>${sp?fmt(mx):""}</span></div></div>
<div class="tm">${fmt(mu)}<small>${c.length} kayıt</small></div></article>`});
h+=`</section>`});
$("v1").innerHTML=h;
$("v1").querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{selDay=+b.dataset.d;renderSum()});
}

function renderHist(){
if(!recs.length){$("v2").innerHTML='<div class="empty">Henüz kayıt yok.</div>';return}
const s=[...recs].sort((a,b)=>(b.d+b.act).localeCompare(a.d+a.act)),gr={};
s.forEach(r=>(gr[r.d]=gr[r.d]||[]).push(r));
$("v2").innerHTML=Object.keys(gr).map(d=>`<div class="dh">${d.split("-").reverse().join(".")} · ${FULL[dow(d)]}</div><div class="card" style="padding:4px 16px">${gr[d].map(r=>{const y=r.dir||"Gidiş";return`<div class="rw"><span class="pill ${cls(y)}">${y}</span><div><b>${esc(r.line)}</b> <span class="mut">${r.stop?esc(r.stop):""}</span></div><span class="t">${r.act}</span><button class="del" data-i="${r.id}">Sil</button></div>`}).join("")}</div>`).join("")+
`<div style="margin-top:22px"><button class="ghost" id="ex">Yedeği kopyala</button><button class="ghost" id="im">Yedekten yükle</button><div class="mut" id="bm" style="margin-top:8px"></div></div>`;
$("v2").querySelectorAll(".del").forEach(b=>b.onclick=()=>{if(!b.dataset.c){b.dataset.c=1;b.textContent="Emin misin?";b.style.fontWeight=700;setTimeout(()=>{b.dataset.c="";b.textContent="Sil";b.style.fontWeight=""},3000);return}recs=recs.filter(r=>r.id!=b.dataset.i);save();renderHist()});
$("ex").onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(recs));$("bm").textContent="Kopyalandı."}catch(e){$("bm").textContent="Kopyalanamadı."}};
$("im").onclick=()=>{$("bm").innerHTML='<textarea id="bt" rows="3" placeholder="Yedek metnini buraya yapıştır"></textarea><button class="ghost" id="bg">Mevcut kayıtlara ekle</button>';$("bg").onclick=()=>{try{const a=JSON.parse($("bt").value);if(!Array.isArray(a))throw 0;const ids=new Set(recs.map(r=>r.id)),n=a.filter(r=>r&&r.id&&r.d&&r.line&&r.act&&!ids.has(r.id));recs=recs.concat(n);save();renderHist();$("bm").textContent=n.length+" yeni kayıt eklendi."}catch(e){$("bm").textContent="Geçersiz yedek."}}};
}
renderForm();
</script>
</body>
</html>
